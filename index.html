      <div style="max-width:720px;margin:60px auto;padding:0 24px;font-family:system-ui,sans-serif;line-height:1.9;color:#111">
        <h1 style="font-size:32px;margin:0 0 8px">滕龙吟 Longyin Teng</h1>
        <p style="color:#666;margin:0 0 24px">北京工业大学建筑与城市规划学院 工学博士</p>
        <p>用探地雷达、三维激光扫描和 GIS，研究中国传统城市怎么长出来的，以及古建筑还能站多久。</p>
        <p><strong>研究一：</strong>将 256 座清代县城的道路网从历史地图逐条数字化，提出“规整—有机指数”（GOI），量化城市路网的规划性与自发性。</p>
        <p><strong>研究二：</strong>探地雷达与三维激光扫描融合的长城／砖石遗产无损检测，在密云 1:1 仿真长城试验平台完成模型搭建、设备联调、数据标注与算法优化。</p>
        <p><strong>成果：</strong>ISPRS Int. J. Geo-Inf. 2026, 15(7), 295（第一作者）；Sustainability 2025, 17(13), 6065（共同第一作者）；国际发明专利 1 项（第一发明人）；软件著作权 10 项。</p>
